{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>(function(){try{var t=localStorage.getItem('techfinitys-theme')||'light';document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='light';}})();</script><title>Sign in · Techfinitys®</title><link rel="stylesheet" href="{% static 'workspace/app.css' %}"><link rel="stylesheet" href="{% static 'workspace/enterprise.css' %}"></head>
<body class="login-page"><button class="theme-toggle login-theme-toggle" id="loginThemeToggle" type="button" aria-label="Switch theme"><span class="theme-icon">◐</span><span id="loginThemeLabel">Dark</span></button><form method="post" class="login-card">{% csrf_token %}<img src="{% static 'images/techfinitys-logo.png' %}" alt="Techfinitys"><h1>Sign in to your workspace</h1><p>Your work, clients, and projects — connected in one secure place.</p>{% if error %}<div class="notice">{{ error }}</div>{% endif %}<label>Username<input name="username" required autofocus></label><label>Password<input name="password" type="password" required></label><button class="primary" type="submit">Sign in</button><small>Need access? Contact your workspace administrator.</small></form><script>(function(){var b=document.getElementById('loginThemeToggle'),l=document.getElementById('loginThemeLabel');function sync(){var t=document.documentElement.dataset.theme||'light';if(l)l.textContent=t==='dark'?'Dark':'Light';if(b)b.setAttribute('aria-pressed',String(t==='dark'));}if(b)b.addEventListener('click',function(){var n=(document.documentElement.dataset.theme||'light')==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('techfinitys-theme',n);}catch(e){}sync();});sync();})();</script></body></html>
