{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>(function(){try{var t=localStorage.getItem('techfinitys-theme')||'light';document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='light';}})();</script>
<title>Techfinitys® CRM</title>
<link rel="icon" href="{% static 'images/techfinitys-logo.png' %}">
<link rel="stylesheet" href="{% static 'workspace/app.css' %}?v=20261118-projects-plus"><link rel="stylesheet" href="{% static 'workspace/enterprise.css' %}?v=20261118-projects-plus">
<link rel="stylesheet" href="{% static 'workspace/projects_plus.css' %}?v=20261123-dashboard-links-1">
<link rel="stylesheet" href="{% static 'workspace/collaboration.css' %}?v=20261118-collaboration-1">
<link rel="stylesheet" href="{% static 'workspace/billing.css' %}?v=20261118-billing-1">
<link rel="stylesheet" href="{% static 'workspace/admin_activity.css' %}?v=20261118-activity-1">
<link rel="stylesheet" href="{% static 'workspace/admin_activity_ledgers.css' %}?v=20261123-employee-ledgers-1">
<link rel="stylesheet" href="{% static 'workspace/zoho_next.css' %}?v=20261124-dark-contrast-v6">
<link rel="stylesheet" href="{% static 'workspace/personal_settings.css' %}?v=20261124-audio-chime-v3">
<link rel="stylesheet" href="{% static 'workspace/notification_popups.css' %}?v=20261124-popups-v1">
</head>
<body>
<div id="app" class="shell">
  <aside class="sidebar">
    <a class="brand" href="/"><img src="{% static 'images/techfinitys-logo.png' %}" alt="Techfinitys"><span>techfinitys<sup>®</sup></span></a>
    <div class="workspace" id="workspaceCard"></div>
    <span class="nav-label">TECHFINITYS OS · WORKSPACES</span>
    <nav id="nav"></nav>
    <section id="tfRecentProjects" class="tf-recent" aria-label="Recent projects"><header class="tf-recent-head"><span>Recent Projects</span><button type="button" id="tfRecentSearchBtn" title="Search projects" aria-label="Search recent projects">⌕</button></header><div id="tfRecentList" class="tf-recent-list"><span class="tf-recent-empty">Loading projects…</span></div></section>
    <div id="tfChatDock" class="tf-chat-dock" hidden></div>
    <div class="sidebar-bottom"><span class="online"></span>Connected workspace<small>Hierarchy-aware access</small></div>
  </aside>
  <div class="main">
    <header class="topbar"><div class="topbar-left"><span class="crumb">Workspace</span><span>›</span><strong id="crumbTitle">Overview</strong><span class="tf-secure-pill" title="Client data is isolated by account and role"><i class="online" aria-hidden="true"></i> Secure workspace</span></div><div class="topbar-actions"><button id="commandBtn" class="global-search" type="button" title="Search workspace (Ctrl + K)">⌕ <span>Search anything...</span> <kbd>⌘ K</kbd></button><button id="quickBtn" class="quick-btn" type="button">＋ New</button><button id="tfEmployeeRefresh" class="tf-employee-refresh" type="button" aria-label="Refresh employee workspace" title="Refresh tasks, projects and updates" hidden>↻ <span>Refresh</span></button><button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme"><span class="theme-icon">◐</span><span id="themeLabel">Dark</span></button><button class="icon" id="bellBtn">◌</button><button id="topAvatar" class="avatar small tf-profile-trigger" type="button" title="Edit profile" aria-label="Edit your profile">TF</button><a class="toplink" href="/logout/">Sign out</a></div></header>
    <div class="tf-security-metadata" aria-hidden="true"><span id="todayTop"></span><strong id="rolePill"></strong></div>
    <div class="tf-aurora-ribbons" aria-hidden="true"></div>
    <main id="mainContent"><div class="empty">Loading CRM…</div></main>
    <footer><img src="{% static 'images/techfinitys-logo.png' %}" width="24" height="24" alt=""><strong>Techfinitys®</strong><span>Clients, people and delivery — connected.</span><small>Django CRM</small></footer>
  </div>
</div>
<button id="tfMobileChatTrigger" class="tf-mobile-chat-trigger" type="button" hidden onclick="TFCollab.show('chats')" aria-label="Open employee chat">✉<span id="tfMobileUnread"></span></button>
<div id="tfChatPanel" class="tf-chat-panel" hidden></div>
<div id="tfProfileDialog" class="tf-profile-dialog" hidden></div>
<div id="toastHost" role="status" aria-live="polite"></div>
<div id="tfTaskDrawerHost"></div>
<div id="modalRoot"></div>
<script src="{% static 'workspace/app.js' %}?v=20261124-user-preferences-v1"></script>
<script src="{% static 'workspace/enterprise.js' %}?v=20261124-preferences-route-v3"></script>
<script src="{% static 'workspace/projects_plus.js' %}?v=20261124-employee-inline-tasks-1"></script>
<script src="{% static 'workspace/collaboration.js' %}?v=20261124-chat-popups-v2"></script>
<script src="{% static 'workspace/personal_settings.js' %}?v=20261124-audio-chime-v3"></script>
<script src="{% static 'workspace/notification_popups.js' %}?v=20261124-chat-popups-v2"></script>
<script src="{% static 'workspace/billing.js' %}?v=20261118-billing-1"></script>
<script src="{% static 'workspace/admin_activity.js' %}?v=20261124-activity-placement-v2"></script></body>
</html>
