# Temporary demonstration deployment on Render Free.
# SQLite data and uploaded files are EPHEMERAL: lost on restart, redeploy or spin-down.
# DO NOT use for real CRM clients, employees, attendance or financial records.
# Switch to durable managed PostgreSQL and object storage before production.
services:
  - type: web
    name: techfinitys-crm
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python manage.py check && python manage.py test workspace.test_billing workspace.test_admin_activity -v 1 && python manage.py collectstatic --noinput
    startCommand: bash start.sh
    healthCheckPath: /login/
    envVars:
      - key: DJANGO_DEBUG
        value: 'false'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CRM_ADMIN_USERNAME
        value: 'admin'
      - key: CRM_ADMIN_PASSWORD
        generateValue: true
      - key: PYTHON_VERSION
        value: '3.13.2'
