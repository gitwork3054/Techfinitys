# Demo deployment: free Render web service + free PostgreSQL.
# Free Postgres is not suitable for durable production CRM data.
services:
  - type: web
    name: techfinitys-crm
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash start.sh
    healthCheckPath: /login/
    envVars:
      - key: DJANGO_DEBUG
        value: 'false'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CRM_ADMIN_USERNAME
        value: 'admin'
      - key: CRM_ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: techfinitys-crm-db
          property: connectionString
      - key: PYTHON_VERSION
        value: '3.13.2'
databases:
  - name: techfinitys-crm-db
    databaseName: techfinitys_crm
    plan: free
    region: singapore
